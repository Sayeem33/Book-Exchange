<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Users</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Optional: Custom theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        dark: '#111827'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen p-8">

<div class="flex justify-between items-center mb-8">

    <h1 class="text-3xl font-bold text-dark">👑 Admin Dashboard</h1>

    <div class="flex gap-3 items-center">

        <span class="text-sm bg-primary text-white px-4 py-2 rounded-full shadow">
            Users Management
        </span>

        <a href="/dashboard"
           class="bg-white text-primary font-semibold px-4 py-2 rounded-full shadow hover:bg-gray-100 transition">
            ⬅ Back to Dashboard
        </a>

    </div>

</div>

<!-- TABLE CONTAINER -->
<div class="bg-white shadow-xl rounded-2xl overflow-hidden">

    <!-- TABLE -->
    <table class="w-full text-left">

        <!-- HEADER -->
        <thead class="bg-primary text-white">
        <tr>
            <th class="p-4">ID</th>
            <th class="p-4">Name</th>
            <th class="p-4">Email</th>
            <th class="p-4">Role</th>
            <th class="p-4">Books</th>
        </tr>
        </thead>

        <!-- BODY -->
        <tbody>

        <tr th:each="user : ${users}"
            class="border-b hover:bg-gray-50 transition">

            <td class="p-4 font-medium" th:text="${user.id}"></td>
            <td class="p-4 font-semibold text-gray-800" th:text="${user.name}"></td>
            <td class="p-4 text-gray-600" th:text="${user.email}"></td>

            <!-- ROLE BADGE -->
            <td class="p-4">

                <span th:if="${user.role.name() == 'ADMIN'}"
                      class="px-3 py-1 text-xs rounded-full bg-red-100 text-red-600 font-semibold">
                    ADMIN
                </span>

                <span th:if="${user.role.name() == 'SELLER'}"
                      class="px-3 py-1 text-xs rounded-full bg-green-100 text-green-600 font-semibold">
                    SELLER
                </span>

                <span th:if="${user.role.name() == 'BUYER'}"
                      class="px-3 py-1 text-xs rounded-full bg-blue-100 text-blue-600 font-semibold">
                    BUYER
                </span>

            </td>

            <!-- BOOKS -->
            <td class="p-4">

                <!-- Seller books -->
                <div th:if="${user.role.name() == 'SELLER'}">

                    <div th:if="${user.books != null and !user.books.isEmpty()}">

                        <div th:each="book : ${user.books}"
                             class="bg-gray-100 rounded-lg px-3 py-2 mb-2 text-sm shadow-sm">

                            📖 <span class="font-medium" th:text="${book.title}"></span>
                            <span class="text-gray-500"
                                  th:text="'#' + ${book.id}"></span>

                        </div>

                    </div>

                    <span th:if="${user.books == null or user.books.isEmpty()}"
                          class="text-gray-400 text-sm">
                        No books
                    </span>

                </div>

                <!-- Buyer -->
                <div th:if="${user.role.name() == 'BUYER'}"
                     class="text-gray-400 text-sm">
                    Buyer (no books)
                </div>

                <!-- Admin -->
                <div th:if="${user.role.name() == 'ADMIN'}"
                     class="text-purple-500 text-sm font-medium">
                    System Admin
                </div>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
