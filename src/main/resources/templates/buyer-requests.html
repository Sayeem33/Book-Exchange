<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Requests - Book Exchange</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>My Exchange Requests</h1>
    <a th:href="@{/}">Back to Home</a>
</header>
<main>
    <p th:if="${#lists.isEmpty(requests)}">No exchange requests found.</p>
    <table th:if="${!#lists.isEmpty(requests)}">
        <thead>
        <tr>
            <th>Book ID</th>
            <th>Message</th>
            <th>Status</th>
            <th>Seller</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${requests}">
            <td th:text="${r.bookId}">1</td>
            <td th:text="${r.message}">Message</td>
            <td th:text="${r.status}">PENDING</td>
            <td th:text="${r.sellerUsername}">seller</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
