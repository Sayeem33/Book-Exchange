<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Browse Books</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

<!-- NAVBAR -->
<div class="bg-white shadow-sm border-b px-8 py-5 flex justify-between items-center">

    <h1 class="text-xl font-bold">📚 Book Market</h1>

    <div class="flex gap-3">

        <a href="/dashboard"
           class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition">
            ⬅ Dashboard
        </a>

        <a href="/buyer/saved-books"
           class="px-4 py-2 bg-pink-500 text-white rounded-lg hover:bg-pink-600 transition">
            ❤️ Saved Books
        </a>

    </div>

</div>
<!-- TITLE -->
<div class="text-center mt-10">
    <h2 class="text-3xl font-bold">Browse Books</h2>
    <p class="text-gray-500 mt-2">Discover and save your favorite books</p>
</div>

<!-- GRID -->
<div class="max-w-6xl mx-auto px-6 mt-10 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- BOOK CARD -->
    <div th:each="book : ${books}"
         class="bg-white border rounded-xl p-5 shadow-sm hover:shadow-md transition">

        <h3 class="text-lg font-bold mb-1"
            th:text="${book.title}">
            Title
        </h3>

        <p class="text-gray-500 text-sm mb-2"
           th:text="${book.author}">
            Author
        </p>

        <p class="text-gray-700 text-sm mb-4"
           th:text="${#strings.abbreviate(book.description, 100)}">
            Description
        </p>

        <!-- BUTTONS -->
        <div class="flex gap-2">

            <!-- VIEW -->
            <button
                    class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg"
                    data-bs-toggle="modal"
                    data-bs-target="#bookModal"
                    th:attr="onclick=|viewBook(${book.id})|">
                View
            </button>

            <!-- SAVE -->
            <form th:action="@{'/buyer/save-book/' + ${book.id}}" method="post" class="flex-1">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <button class="w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg">
                    Save
                </button>
            </form>

        </div>

    </div>

</div>

<!-- MODAL -->
<div class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center" id="bookModal">

    <div class="bg-white p-6 rounded-xl w-96 shadow-lg">

        <h2 id="mTitle" class="text-xl font-bold mb-2"></h2>
        <p id="mAuthor" class="text-gray-500 mb-2"></p>
        <p id="mDesc" class="text-gray-700"></p>

        <button onclick="document.getElementById('bookModal').style.display='none'"
                class="mt-4 w-full bg-gray-800 text-white py-2 rounded-lg">
            Close
        </button>

    </div>

</div>

<script>
    function viewBook(id) {

        document.getElementById('bookModal').style.display = 'flex';

        fetch('/buyer/book/' + id)
            .then(res => res.json())
            .then(data => {

                document.getElementById("mTitle").innerText = data.title;
                document.getElementById("mAuthor").innerText = "Author: " + data.author;
                document.getElementById("mDesc").innerText = data.description;

            });
    }
</script>

</body>
</html>
