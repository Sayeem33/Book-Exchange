<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1e40af'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-blue-300 min-h-screen flex items-center justify-center">

<div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-md">

    <h2 class="text-3xl font-bold text-center text-primary mb-6">
        Create Account 🚀
    </h2>

    <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-4">

        <input type="text" th:field="*{name}" placeholder="Name"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
               required />

        <input type="email" th:field="*{email}" placeholder="Email"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
               required />

        <input type="password" th:field="*{password}" placeholder="Password"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
               required />

        <select th:field="*{role}"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                required>
            <option value="">Select Role</option>
            <option value="SELLER">Seller</option>
            <option value="BUYER">Buyer</option>
        </select>

        <button type="submit"
                class="w-full bg-primary text-white py-2 rounded-lg hover:bg-secondary transition duration-200">
            Register
        </button>
    </form>

    <p class="text-center text-sm mt-4">
        Already have an account?
        <a th:href="@{/login}" class="text-primary font-semibold hover:underline">
            Login
        </a>
    </p>

</div>

</body>
</html>
