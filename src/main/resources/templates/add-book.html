<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="w-full max-w-2xl bg-white shadow-xl rounded-2xl p-8">

    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">
        📚 Add New Book
    </h2>

    <form action="/seller/add-book" method="post" class="space-y-5">

        <!-- CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Title -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Title</label>
            <input type="text" name="title" required
                   class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Author -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Author</label>
            <input type="text" name="author" required
                   class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Description -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Description</label>
            <textarea name="description" rows="5" required
                      class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <!-- Button -->
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200">
            🚀 Save Book
        </button>

    </form>

    <!-- Back link -->
    <div class="text-center mt-6">
        <a href="/seller/books"
           class="text-blue-600 hover:underline font-medium">
            ← Back to My Books
        </a>
    </div>

</div>

</body>
</html>
