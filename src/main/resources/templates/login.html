<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',  // blue-600
                        secondary: '#1e40af' // blue-800
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-blue-300 min-h-screen flex items-center justify-center">

<div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-md">

    <h2 class="text-3xl font-bold text-center text-primary mb-6">
        Welcome Back 👋
    </h2>

    <!-- Error -->
    <p class="text-red-500 text-sm mb-3 text-center" th:if="${param.error}">
        Invalid email or password
    </p>

    <!-- Logout -->
    <p class="text-green-500 text-sm mb-3 text-center" th:if="${param.logout}">
        You have been logged out
    </p>

    <form th:action="@{/login}" method="post" class="space-y-4">

        <input type="email" name="username" placeholder="Email"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
               required />

        <input type="password" name="password" placeholder="Password"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
               required />

        <button type="submit"
                class="w-full bg-primary text-white py-2 rounded-lg hover:bg-secondary transition duration-200">
            Login
        </button>
    </form>

    <p class="text-center text-sm mt-4">
        No account?
        <a th:href="@{/register}" class="text-primary font-semibold hover:underline">
            Register
        </a>
    </p>

</div>

</body>
</html>
