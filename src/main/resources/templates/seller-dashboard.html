<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Book Exchange</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Seller Dashboard</h1>
    <a th:href="@{/}">Back to Home</a>
</header>
<main>
    <p th:if="${#lists.isEmpty(books)}">You have not listed any books yet.</p>
    <table th:if="${!#lists.isEmpty(books)}">
        <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Condition</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.title}">Title</td>
            <td th:text="${book.authorName}">Author</td>
            <td th:text="${book.condition}">Condition</td>
            <td th:text="${book.status}">Status</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
