services:
  postgres:
    image: postgres:16-alpine
    container_name: bookexchange-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookexchange}
      POSTGRES_USER: ${POSTGRES_USER:-bookuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookuser} -d ${POSTGRES_DB:-bookexchange}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookexchange-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookexchange}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bookuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bookpass}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8081}:8080"

volumes:
  postgres-data:
